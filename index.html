<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bywater Cat Mapper</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; background-color: #e0e0e0; }
        #status { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.9); color: white; padding: 12px 15px; border-radius: 6px; z-index: 1000; font-size: 13px; max-width: 300px; overflow-y: auto; max-height: 200px; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
        .popup-form { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: white; border-radius: 4px; }
        input, button { padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        input[type="text"] { width: 100%; }
        input[type="file"] { width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="status"><span class="info">🔄 Initializing...</span></div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0"></script>
    
    <script>
        let supabase = null;
        const statusEl = document.getElementById('status');
        const logs = [];
        
        function updateStatus(message, type = 'info') {
            logs.push(`${type}: ${message}`);
            console.log(`[${type}]`, message);
            
            // Keep last 10 messages
            if (logs.length > 10) logs.shift();
            
            const lastLog = logs[logs.length - 1];
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            statusEl.innerHTML = `<span class="${className}">${lastLog}</span><br><small>${logs.slice(0, -1).join('<br>')}</small>`;
        }
        
        // Initialize Supabase
        function initSupabase() {
            try {
                updateStatus('Checking for Supabase library...', 'info');
                
                if (!window.supabase) {
                    updateStatus('ERROR: Supabase library not found', 'error');
                    return;
                }
                
                updateStatus('Creating Supabase client...', 'info');
                
                const { createClient } = window.supabase;
                supabase = createClient(
                    'https://ofhjidgvufuehuugfksd.supabase.co',
                    'sb_publishable_nQ0TXS2hvA_0R1MyQvrgCg_2A3_jGW0'
                );
                
                // Sign in as anonymous user to allow writes
                supabase.auth.signInAnonymously().then(() => {
                    updateStatus('✓ Supabase connected!', 'success');
                }).catch(err => {
                    console.warn('Anonymous sign in not needed:', err);
                    updateStatus('✓ Supabase connected!', 'success');
                });
                
            } catch (error) {
                updateStatus(`ERROR: ${error.message}`, 'error');
            }
        }
        
        // Initialize map
        try {
            updateStatus('Initializing map...', 'info');
            
            const map = L.map('map').setView([29.9625, -90.0435], 16);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            
            updateStatus('✓ Map ready', 'success');
            
            // Initialize Supabase after a brief delay
            setTimeout(() => {
                initSupabase();
            }, 1000);
            
            // Click handler
            map.on('click', function(e) {
                const popupContent = document.createElement('div');
                popupContent.className = 'popup-form';
                popupContent.innerHTML = `
                    <input type="text" id="catName" placeholder="Cat Name">
                    <input type="file" id="catPhoto" accept="image/*">
                    <button id="saveBtn">Save Cat</button>
                `;
                
                const popup = L.popup()
                    .setLatLng(e.latlng)
                    .setContent(popupContent)
                    .openOn(map);
                
                popupContent.querySelector('#saveBtn').onclick = async () => {
                    const name = document.getElementById('catName').value;
                    const photoFile = document.getElementById('catPhoto').files[0];
                    
                    if (!name || !photoFile) {
                        alert("Please enter a cat name and upload a photo");
                        return;
                    }
                    
                    if (!supabase) {
                        alert("Supabase not ready. Check status message at top left.");
                        return;
                    }
                    
                    try {
                        updateStatus('📤 Uploading photo...', 'info');
                        
                        const fileName = `${Date.now()}_${photoFile.name}`;
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('cat-photos')
                            .upload(`cats/${fileName}`, photoFile);
                        
                        if (uploadError) {
                            updateStatus(`Upload failed: ${uploadError.message}`, 'error');
                            alert("Upload error: " + uploadError.message);
                            return;
                        }
                        
                        updateStatus('📸 Photo uploaded, saving data...', 'info');
                        
                        const { data: urlData } = supabase.storage
                            .from('cat-photos')
                            .getPublicUrl(`cats/${fileName}`);
                        
                        const { error: dbError, data: dbData } = await supabase.from('Cats').insert([
                            { 
                                cat_name: name, 
                                coordinates: `${e.latlng.lat},${e.latlng.lng}`, 
                                photo_url: urlData.publicUrl 
                            }
                        ]);
                        
                        if (dbError) {
                            updateStatus(`Save failed: ${dbError.message}`, 'error');
                            alert("Error saving cat: " + dbError.message);
                            return;
                        }
                        
                        updateStatus(`✓ Cat "${name}" saved!`, 'success');
                        alert("🐱 Cat saved successfully!");
                        map.closePopup();
                        
                    } catch (error) {
                        updateStatus(`Exception: ${error.message}`, 'error');
                        alert("Error: " + error.message);
                    }
                };
            });
            
        } catch (error) {
            updateStatus(`Map error: ${error.message}`, 'error');
        }
    </script>
</body>
</html>
