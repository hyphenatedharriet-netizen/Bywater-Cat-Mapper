
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bywater Cat Mapper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .popup-form { display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const supabase = supabase.createClient(
            'https://ofhjidgvufuehuugfksd.supabase.co',
            'sb_publishable_nQ0TXS2hvA_0R1MyQvrgCg_2A3_jGW0'
        );

        const map = L.map('map').setView([29.9655, -90.0345], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        map.on('click', function(e) {
            const popupContent = `
                <div class="popup-form">
                    <input type="text" id="name" placeholder="Cat Name">
                    <input type="text" id="photo" placeholder="Photo URL">
                    <button onclick="saveCat(${e.latlng.lat}, ${e.latlng.lng})">Save Cat</button>
                </div>
            `;
            L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
        });

        async function saveCat(lat, lng) {
            const name = document.getElementById('name').value;
            const photo = document.getElementById('photo').value;
            const { error } = await supabase.from('Cats').insert([
                { cat_name: name, coordinates: `${lat},${lng}`, photo_url: photo }
            ]);
            if (error) alert("Error saving: " + error.message);
            else { alert("Saved!"); map.closePopup(); }
        }
    </script>
</body>
</html>
