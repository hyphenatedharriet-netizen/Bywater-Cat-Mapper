<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bywater Cat Mapper</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; background-color: #e0e0e0; }
        #status { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 4px; z-index: 1000; font-size: 12px; }
        .popup-form { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: white; border-radius: 4px; }
        input, button { padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        input[type="text"] { width: 100%; }
        input[type="file"] { width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="status">🔄 Initializing...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0"></script>
    
    <script>
        console.log("=== Bywater Cat Mapper Starting ===");
        
        let supabase = null;
        const statusEl = document.getElementById('status');
        
        // Initialize Supabase immediately
        function initSupabase() {
            try {
                if (!window.supabase) {
                    console.error("Supabase library not available");
                    statusEl.textContent = "❌ Supabase library failed to load";
                    return;
                }
                
                const { createClient } = window.supabase;
                supabase = createClient(
                    'https://ofhjidgvufuehuugfksd.supabase.co',
                    'sb_publishable_nQ0TXS2hvA_0R1MyQvrgCg_2A3_jGW0'
                );
                console.log("✓ Supabase initialized successfully");
                statusEl.textContent = "✓ Ready";
                statusEl.style.background = "rgba(0,128,0,0.7)";
            } catch (error) {
                console.error("Supabase init error:", error);
                statusEl.textContent = "❌ " + error.message;
                statusEl.style.background = "rgba(255,0,0,0.7)";
            }
        }
        
        // Initialize map immediately
        try {
            const map = L.map('map').setView([29.9625, -90.0435], 16);
            console.log("✓ Map initialized");
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            console.log("✓ Tiles loaded");
            
            // Wait a moment then init Supabase
            setTimeout(() => {
                initSupabase();
            }, 500);
            
            // Click handler
            map.on('click', function(e) {
                console.log("Click detected at", e.latlng);
                
                const popupContent = document.createElement('div');
                popupContent.className = 'popup-form';
                popupContent.innerHTML = `
                    <input type="text" id="catName" placeholder="Cat Name">
                    <input type="file" id="catPhoto" accept="image/*">
                    <button id="saveBtn">Save Cat</button>
                `;
                
                const popup = L.popup()
                    .setLatLng(e.latlng)
                    .setContent(popupContent)
                    .openOn(map);
                
                popupContent.querySelector('#saveBtn').onclick = async () => {
                    const name = document.getElementById('catName').value;
                    const photoFile = document.getElementById('catPhoto').files[0];
                    
                    if (!name || !photoFile) {
                        alert("Please enter a cat name and upload a photo");
                        return;
                    }
                    
                    if (!supabase) {
                        alert("Supabase is not connected. Check the status indicator (top-left) or press F12 to see errors.");
                        return;
                    }
                    
                    try {
                        statusEl.textContent = "📤 Uploading...";
                        
                        // Upload photo to Supabase
                        const fileName = `${Date.now()}_${photoFile.name}`;
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('cat-photos')
                            .upload(`cats/${fileName}`, photoFile);
                        
                        if (uploadError) {
                            console.error("Upload error:", uploadError);
                            alert("Error uploading photo: " + uploadError.message);
                            statusEl.textContent = "✓ Ready";
                            return;
                        }
                        
                        console.log("Photo uploaded:", uploadData);
                        
                        // Get public URL
                        const { data: urlData } = supabase.storage
                            .from('cat-photos')
                            .getPublicUrl(`cats/${fileName}`);
                        
                        // Save cat data to database
                        const { error: dbError } = await supabase.from('Cats').insert([
                            { 
                                cat_name: name, 
                                coordinates: `${e.latlng.lat},${e.latlng.lng}`, 
                                photo_url: urlData.publicUrl 
                            }
                        ]);
                        
                        if (dbError) {
                            console.error("Database error:", dbError);
                            alert("Error saving cat: " + dbError.message);
                            statusEl.textContent = "✓ Ready";
                            return;
                        }
                        
                        console.log("Cat saved successfully!");
                        alert("🐱 Cat saved successfully!");
                        map.closePopup();
                        statusEl.textContent = "✓ Ready";
                        
                    } catch (error) {
                        console.error("Error:", error);
                        alert("Error: " + error.message);
                        statusEl.textContent = "✓ Ready";
                    }
                };
            });
            
            console.log("✓ Click handler registered");
            
        } catch (error) {
            console.error("Error initializing map:", error);
            statusEl.textContent = "❌ Map error: " + error.message;
            statusEl.style.background = "rgba(255,0,0,0.7)";
        }
    </script>
</body>
</html>
