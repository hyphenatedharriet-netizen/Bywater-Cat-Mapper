<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bywater Crazy Cat Ladies Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f7f9fa; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background-color: #2c3e50; color: #ffffff; padding: 12px 16px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; }
        header h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
        header p { margin: 4px 0 0 0; font-size: 0.85rem; color: #b2bec3; }
        #map-container { flex: 1; width: 100%; position: relative; }
        #map { width: 100%; height: 100%; }
        .cat-popup-form { padding: 6px 4px; min-width: 180px; }
        .cat-popup-form label { display: block; font-size: 0.9rem; font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
        .cat-popup-form input[type="text"] { width: 100%; padding: 8px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; outline: none; }
        .cat-popup-form input[type="file"] { display: none; }
        .photo-label-btn { display: block; text-align: center; background-color: #3498db; color: white; padding: 8px; font-size: 0.85rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
        .cat-popup-form button.save-btn { width: 100%; background-color: #27ae60; color: white; border: none; padding: 8px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .cat-label-popup { font-size: 1.05rem; font-weight: bold; color: #2c3e50; text-align: center; margin: 4px 0; }
        .cat-popup-img { width: 100%; max-width: 150px; height: auto; border-radius: 6px; display: block; margin: 8px auto 4px auto; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Bywater Crazy Cat Ladies Map</h1>
        <p>Tap anywhere on the neighborhood streets to drop a pin</p>
    </header>
    <div id="map-container"><div id="map"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const SUPABASE_URL = "https://ofhjidgvufuehuugfksd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_nQ0TXS2hvA_0R1w3v9"; 

        // Centered exactly on 70117 with a tighter zoom level (16) so it's street-level focused
        const map = L.map('map', { 
            zoomControl: true, 
            tap: false,
            maxBounds: [[29.9500, -90.0550], [29.9800, -90.0150]], // Locks view to the neighborhood area
            maxBoundsViscosity: 1.0
        }).setView([29.9655, -90.0345], 16); 

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            attribution: '&copy; OpenStreetMap',
            minZoom: 14,
            maxZoom: 19
        }).addTo(map);

        function renderCatMarker(cat) {
            let popupContent = `<div class="cat-label-popup">🐱 ${cat.name}</div>`;
            if (cat.photo) {
                popupContent += `<img src="${cat.photo}" class="cat-popup-img" />`;
            }
            L.marker(cat.coords).addTo(map).bindPopup(popupContent);
        }

        async function loadSharedCats() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/cats?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    data.forEach(cat => {
                        const parsedCoords = typeof cat.coords === 'string' ? JSON.parse(cat.coords) : cat.coords;
                        renderCatMarker({ name: cat.name, coords: parsedCoords, photo: cat.photo });
                    });
                }
            } catch (err) {
                console.error("Error fetching map pins:", err);
            }
        }
        loadSharedCats();

        map.on('click', function(e) {
            const coords = [e.latlng.lat, e.latlng.lng];
            let imageData = "";
            
            const formHtml = `
                <div class="cat-popup-form">
                    <label>What's their name?</label>
                    <input type="text" id="catNameInput" placeholder="e.g., Barnaby" autofocus />
                    <label for="catPhotoInput" class="photo-label-btn" id="photoBtnLabel">📸 Add Photo</label>
                    <input type="file" id="catPhotoInput" accept="image/*" />
                    <button id="saveCatBtn" class="save-btn">Save Location</button>
                </div>
            `;
            
            L.popup().setLatLng(coords).setContent(formHtml).openOn(map);
            setTimeout(() => { document.getElementById('catNameInput').focus(); }, 100);
            
            document.getElementById('catPhotoInput').addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 250; 
                            let width = img.width;
                            let height = img.height;
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            imageData = canvas.toDataURL('image/jpeg', 0.5); 
                            document.getElementById('photoBtnLabel').innerText = "✅ Photo Attached";
                            document.getElementById('photoBtnLabel').style.backgroundColor = "#2ecc71";
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('saveCatBtn').addEventListener('click', async function() {
                const nameInput = document.getElementById('catNameInput').value.trim();
                if (!nameInput) return;
                
                const newCatData = { name: nameInput, coords: coords, photo: imageData };

                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/cats`, {
                        method: 'POST',
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`,
                            "Content-Type": "application/json",
                            "Prefer": "return=representation"
                        },
                        body: JSON.stringify(newCatData)
                    });
                    
                    if (response.ok) {
                        renderCatMarker(newCatData);
                        map.closePopup();
                    } else {
                        alert("Database configuration mismatch! Double check your Table Editor columns.");
                    }
                } catch (err) {
                    console.error("Network connection error:", err);
                }
            });
        });
    </script>
</body>
</html>
